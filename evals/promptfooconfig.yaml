description: CareerLoop 路由、工具面、引用校验与模型行为回归
prompts:
  - careerloop-eval
providers:
  - id: file://providers/careerloop_eval.py
    label: careerloop-eval
    config:
      pythonExecutable: ../backend/.venv/bin/python
tests:
  - file://cases/routes.json
  - file://cases/citations.json
  - file://cases/model_behavior.json
defaultTest:
  assert:
    - type: javascript
      value: |
        const result = JSON.parse(output);
        const expected = context.vars.expected || {};
        if (expected.kind && result.kind !== expected.kind) {
          throw new Error(`kind=${result.kind}, expected ${expected.kind}`);
        }
        const tools = result.allowed_tools || [];
        if (expected.empty_tools && tools.length) {
          throw new Error(`tools should be empty, got ${JSON.stringify(tools)}`);
        }
        if (expected.allowed_tools && JSON.stringify(tools) !== JSON.stringify(expected.allowed_tools)) {
          throw new Error(`allowed_tools=${JSON.stringify(tools)}`);
        }
        for (const name of expected.contains_tools || []) {
          if (!tools.includes(name)) {
            throw new Error(`missing tool ${name}`);
          }
        }
        const forbidden = [...(expected.forbidden_tools || [])];
        if (expected.forbid_ask_user !== false && !forbidden.includes('ask_user')) {
          forbidden.push('ask_user');
        }
        for (const name of forbidden) {
          if (tools.includes(name)) {
            throw new Error(`forbidden tool ${name}`);
          }
        }
        if ('valid' in expected && result.valid !== expected.valid) {
          throw new Error(`valid=${result.valid}, expected ${expected.valid}`);
        }
        if (expected.error_contains && !(result.error || '').includes(expected.error_contains)) {
          throw new Error(`error=${result.error}`);
        }
        if (expected.parsed_tools && JSON.stringify(result.parsed_tools || []) !== JSON.stringify(expected.parsed_tools)) {
          throw new Error(`parsed_tools=${JSON.stringify(result.parsed_tools)}`);
        }
        for (const name of expected.dropped_tools || []) {
          if (!(result.dropped_tools || []).includes(name)) {
            throw new Error(`missing dropped tool ${name}`);
          }
        }
        for (const key of ['used_ask_user', 'should_ask_user', 'violation', 'keyword_kind']) {
          if (key in expected && result[key] !== expected[key]) {
            throw new Error(`${key}=${result[key]}`);
          }
        }
        return true;
