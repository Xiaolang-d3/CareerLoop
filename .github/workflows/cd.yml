name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  publish:
    # PRs, forks, manual CI runs and failed CI never publish deployment code.
    if: >-
      github.repository == 'Xiaolang-d3/CareerLoop' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Ignore superseded CI runs
        id: current
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [[ "$latest" == "$DEPLOY_SHA" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit is waiting for its own CI; skip this release.'
          fi
      - uses: actions/checkout@v7
        if: steps.current.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: steps.current.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.ready == 'true'
        with:
          name: frontend-dist
          path: frontend/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Package the exact code and frontend that passed CI
        if: steps.current.outputs.ready == 'true'
        run: python scripts/deployment.py bundle --source . --output /tmp/dengdeng-release --revision "$DEPLOY_SHA"
      - name: Publish an immutable deployment candidate
        if: steps.current.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tag="deploy-$DEPLOY_SHA"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/existing-draft 2>/dev/null; then
            if [[ "$(cat /tmp/existing-draft)" == false ]]; then
              echo 'This deployment candidate has already been published.'
              exit 0
            fi
            gh release upload "$tag" /tmp/dengdeng-release/app.tar.gz /tmp/dengdeng-release/release.json --clobber
          else
            gh release create "$tag" /tmp/dengdeng-release/app.tar.gz /tmp/dengdeng-release/release.json \
              --target "$DEPLOY_SHA" --draft --prerelease --title "Deploy ${DEPLOY_SHA:0:12}" \
              --notes 'Generated by CD only after the main push passed CI. The Mac agent verifies the commit and checksum before activation.'
          fi
          gh release edit "$tag" --draft=false --prerelease --latest=false
          echo "Deployment candidate: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
