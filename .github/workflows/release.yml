name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v2.0.0。留空则仅构建制品。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Package frontend dist
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          tar -C frontend -czf "dist/careerloop-frontend-${TAG}.tar.gz" dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/careerloop-frontend-${RELEASE_TAG}.tar.gz" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/careerloop-frontend-${RELEASE_TAG}.tar.gz" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
