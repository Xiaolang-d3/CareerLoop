name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require docs when documented code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-docs-sync.sh "$BASE_SHA" "$HEAD_SHA"

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev-lock.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          # Runtime + test lock, every package hash-verified (docs/model-layer.md).
          python -m pip install --require-hashes --no-deps --only-binary :all: -r requirements-dev-lock.txt
      - name: Scan for executable .pth files
        # -I -S: no site processing, so no .pth runs before it is scanned.
        run: python -I -S backend/scripts/scan_pth.py --python python
      - name: Run backend tests
        working-directory: backend
        env:
          EMBEDDING_BACKEND: hash
        run: python -m pytest tests -q --junitxml=pytest-report.xml
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  frontend-e2e:
    name: frontend-e2e
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: frontend-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
      - name: Install integration backend
        run: |
          # Runtime lock only, as deployed.
          python -m pip install --require-hashes --no-deps --only-binary :all: -r backend/requirements-lock.txt
      - name: Scan for executable .pth files
        # -I -S: no site processing, so no .pth runs before it is scanned.
        run: python -I -S backend/scripts/scan_pth.py --python python
      - name: Restore frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        env:
          CI: true
          E2E_PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ runner.os }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-${{ runner.os }}
          path: ${{ runner.workspace }}/output/playwright/*.png
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - docs-sync
      - backend-tests
      - frontend-unit
      - frontend-e2e
    steps:
      - name: Require all CI jobs
        run: |
          set -euo pipefail
          test "${{ needs.backend-tests.result }}" = success
          test "${{ needs.frontend-unit.result }}" = success
          test "${{ needs.frontend-e2e.result }}" = success
          case "${{ needs.docs-sync.result }}" in
            success|skipped) ;;
            *) echo "docs-sync=${{ needs.docs-sync.result }}"; exit 1 ;;
          esac
