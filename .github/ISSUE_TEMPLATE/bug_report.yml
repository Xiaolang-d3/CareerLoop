name: 问题反馈
description: 报告可复现的异常、界面问题或功能缺陷。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进灯灯。请先搜索是否已有相同问题。
        安全漏洞请按 [安全政策](https://github.com/Xiaolang-d3/CareerLoop/blob/main/SECURITY.md) 私密报告。不要提交密钥、Cookie、个人资料或数据库。
  - type: input
    id: version
    attributes:
      label: 版本或提交哈希
      description: 本地开发可运行 git rev-parse --short HEAD；安装包请填写版本号。
      placeholder: 例如 2.0.0 开发预览版，或提交哈希
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统、浏览器或桌面版；涉及模型时补充服务商、模型名和协议，不要填写密钥。
      placeholder: macOS / Windows / Linux；浏览器及版本或桌面版；Python / Node.js 版本（本地开发时）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 用虚构数据给出最小复现步骤。
      placeholder: |
        1. 打开……
        2. 输入或点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明错误提示、发生频率及影响范围。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 只保留相关片段；截图请遮盖邮箱、个人资料、密钥及其他敏感信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并移除材料中的密钥、凭据和个人资料。
          required: true
        - label: 我已阅读并愿意遵守社区行为准则（CODE_OF_CONDUCT.md）。
          required: true
