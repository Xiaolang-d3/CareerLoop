name: 功能建议
description: 描述使用场景、遇到的问题与期望的改进。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请优先描述要解决的问题，便于一起讨论方案。提交前请搜索已有建议，并遵守 [社区行为准则](https://github.com/Xiaolang-d3/CareerLoop/blob/main/CODE_OF_CONDUCT.md)。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在完成什么任务？目前在哪一步遇到困难？不要包含真实个人资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 描述改进后的行为，以及如何判断问题已解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充材料（可选）
      description: 已尝试的方法、取舍、示意图或公开参考链接。
